<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Contact Form </title>
  </head>
  <body class="bod">
    <div class="form">

      <div class="first_box">
        <h1 style="color: rgb(255, 255, 255);">Let's Chat</h1>
        <p class="para">
          Wheater you have a question,want to start <br />a project or simply
          want to connect.
        </p>
        <p class="para">
          Feel free to send me a messages <br />
          in the contact form
        </p>
      </div>
      <div class="second_box">
        <h1 class="contact">Contact</h1>

        <p class="required"><b>• Required</b></p>
        <div>
          <i class="fa-solid fa-user" class="fa-user"></i>
          <input
            type="text"
            name="fname"
            id="name"
            placeholder="Name*"
            class="forum"
          />
        </div>
        <br /><br />
        <div>
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email" placeholder="Email*" class="forum" />
        </div>
        <br /><br />
       <div><i class="fa-solid fa-building"></i>
       <input type="text" id="Company"  placeholder="Company*" class="forum" /></div> 
        <br /><br />
       <div>
        <i class="fa-solid fa-address-book"></i>
        <input
          type="text"
          name="Phone"
          id="Phone"
          placeholder="Phone*"
          class="forum"
        /></div>
        <br /><br />
        
        <i class="fa-regular fa-address-card"></i>
        <textarea
          id="Message"
          placeholder="Message*"
          rows="3"
          cols="47"
          class="mes"
        ></textarea>
        <br /><br />
        <div class="sub">
        <button class="submit" >SUBMIT</b></button>
          <button class="return"><b>RETURN</b></button>
        </div>
      </div>
    </div>
  </body>
</html>
